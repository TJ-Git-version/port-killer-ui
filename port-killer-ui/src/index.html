<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端口占用关闭工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>端口占用关闭工具</h1>
          <p>Port Occupancy Killer · <span id="versionText">v1.0.0</span></p>
        </div>
      </div>
      <div class="header-actions">
        <span id="updateStatus" class="update-status hidden"></span>
        <button id="updateBtn" class="btn btn-ghost btn-sm hidden" title="检查 GitHub Release 是否有新版本">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
            <path d="M20 4v4h-4"></path>
          </svg>
          检查更新
        </button>
        <button id="themeToggle" class="btn btn-icon btn-ghost" title="切换浅色 / 深色主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"></path>
          </svg>
        </button>
        <span id="adminBadge" class="admin-badge"><i class="dot"></i>检测中…</span>
        <button id="relaunchAdminBtn" class="btn btn-ghost btn-sm" title="权限不足时，以管理员身份重启本工具">以管理员身份重启</button>
      </div>
    </header>

    <main>
      <section class="card search-card">
        <div class="search-row">
          <label class="field">
            <span class="field-label">端口号</span>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <input id="portInput" type="text" inputmode="numeric" maxlength="15"
                     placeholder="例如 8080 或 8080-8090" autocomplete="off" spellcheck="false">
            </div>
          </label>
          <button id="queryBtn" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            查询占用
          </button>
          <button id="clearBtn" class="btn btn-ghost">清空</button>
        </div>
        <div class="chips" id="chipBar">
          <span class="chips-label">常用端口</span>
          <button class="chip" data-port="80">80 · HTTP</button>
          <button class="chip" data-port="443">443 · HTTPS</button>
          <button class="chip" data-port="3000">3000</button>
          <button class="chip" data-port="5173">5173 · Vite</button>
          <button class="chip" data-port="3306">3306 · MySQL</button>
          <button class="chip" data-port="6379">6379 · Redis</button>
          <button class="chip" data-port="27017">27017 · MongoDB</button>
          <button class="chip" data-range="8000-8100">8000-8100 · 范围</button>
        </div>
      </section>

      <section class="card results-card">
        <div class="results-header">
          <div class="results-title">
            <h2>占用进程</h2>
            <span id="resultCount" class="badge">未查询</span>
          </div>
          <div class="results-actions">
            <span id="selectedCount" class="selected-text">已选 0 个</span>
            <button id="selectAllBtn" class="btn btn-ghost btn-sm">全选</button>
            <button id="deselectAllBtn" class="btn btn-ghost btn-sm">取消全选</button>
            <button id="killBtn" class="btn btn-danger" disabled>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h18M12 3v18"></path>
              </svg>
              关闭选中进程
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="process-table">
            <thead>
              <tr>
                <th class="col-check"></th>
                <th class="col-pid">PID</th>
                <th>进程名</th>
                <th class="col-proto">协议</th>
                <th>本地地址</th>
                <th class="col-port">端口</th>
                <th class="col-state">状态</th>
              </tr>
            </thead>
            <tbody id="processBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state">
          <svg class="empty-art" viewBox="0 0 200 140" width="220" height="150" fill="none">
            <rect class="ea-card" x="30" y="28" width="140" height="92" rx="16" stroke-width="2"/>
            <circle class="ea-ring" cx="68" cy="62" r="9" fill="none" stroke-width="3"/>
            <circle class="ea-core" cx="68" cy="62" r="3.5"/>
            <path class="ea-beam" d="M84 62h26M120 62h14" stroke-width="3" stroke-linecap="round"/>
            <circle class="ea-ping" cx="68" cy="92" r="5"/>
            <path class="ea-line" d="M84 92h40M136 92h10" stroke-width="3" stroke-linecap="round"/>
            <path class="ea-line" d="M52 108h46M110 108h40" stroke-width="3" stroke-linecap="round"/>
            <path class="ea-star" d="M100 10l6 10 10 6-10 6-6 10-6-10-10-6 10-6z" opacity="0.85"/>
          </svg>
          <p class="empty-title">还没有查询结果</p>
          <p class="empty-desc">输入端口号或范围（如 8080-8090）并点击「查询占用」，即可查看占用对应端口的进程</p>
        </div>

        <div id="loadingOverlay" class="loading-overlay hidden">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在查询端口占用情况…</p>
        </div>
      </section>

      <footer class="app-footer">
        <span>提示：强制结束进程不会保存未保存的数据，请谨慎操作。</span>
        <span>系统关键进程（如 PID 4 System）请勿关闭。</span>
      </footer>
    </main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-icon danger" aria-hidden="true">!</div>
      <h3 class="modal-title">确认操作</h3>
      <p id="confirmText" class="modal-text">确定要强制结束选中的进程吗？</p>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn btn-ghost">取消</button>
        <button id="modalOkBtn" class="btn btn-danger">强制关闭</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
